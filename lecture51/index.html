        <p id="fpara" class="text">First Paragraph</p>

        <div id="fdiv">
            <p>
                This is my First

                    Text.
                </span>
            </p>

                This is my Second para.
            </p>
        </div>
        <br><br>

        <div style="padding: 2rem; background-color: lightblue;">
            Hello World!
            <div id="mydiv" style="padding: 2rem; background-color: lightgray;">
                <p>First</p>
                <p>Second</p>
                <p>Third</p>
            </div>
            Nice to meet you.
        </div>
