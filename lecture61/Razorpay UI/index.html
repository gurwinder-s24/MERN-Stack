<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay</title>
    <link rel="stylesheet" href="main.css">
</head>
<body class="overflow-x-hidden">
    <div class="my-container">

        <!-- Navbar -->
        <nav class="bg-deepBlue">
            <div class="relative flex justify-between items-center w-[1080px] max-w-[90%] mx-auto ">
                <!-- logo -->
                <a href="/" class="cursor-pointer">
                    <img 
                        src="./images/logo.png" 
                        alt="Logo" 
                        class="w-[125px] h-[30px]">
                </a>

                <ul class="flex gap-6">
                    <!-- adding position relative for using absolute positioning on child elements -->
                    <li class="text-white font-mulish py-7 hover:text-lightBlue 
                        cursor-pointer transition-all duration-200 relative group">

                        <a href="#">Payments</a>
                        <div class="absolute w-full h-1 bg-lightBlue bottom-0 
                        hidden group-hover:block transition-all duration-200"></div>
                        
                    </li>
                    <li class="text-white font-mulish py-7 hover:text-lightBlue 
                        cursor-pointer transition-all duration-200 relative group">

                        <a href="#">Banking</a>
                        <div class="absolute w-full h-1 bg-lightBlue bottom-0 
                        hidden group-hover:block transition-all duration-200"></div>
                        
                    </li>
                    <li class="text-white font-mulish py-7 hover:text-lightBlue 
                        cursor-pointer transition-all duration-200 relative group">

                        <a href="#">Corporate Card</a>                       
                    </li>
                    <li class="text-white font-mulish py-7 hover:text-lightBlue 
                        cursor-pointer transition-all duration-200 relative group">

                        <a href="#">Payroll</a>                        
                    </li>
                    <li class="text-white font-mulish py-7 hover:text-lightBlue 
                        cursor-pointer transition-all duration-200 relative group">

                        <a href="#">Resources</a>
                        <div class="absolute w-full h-1 bg-lightBlue bottom-0 
                        hidden group-hover:block transition-all duration-200"></div>
                        
                    </li>
                    <li class="text-white font-mulish py-7 hover:text-lightBlue 
                        cursor-pointer transition-all duration-200 relative group">

                        <a href="#">Support</a>
                        <div class="absolute w-full h-1 bg-lightBlue bottom-0 
                        hidden group-hover:block transition-all duration-200"></div>
                        
                    </li>
                    <li class="text-white font-mulish py-7 hover:text-lightBlue 
                        cursor-pointer transition-all duration-200 relative group">

                        <a href="#">Pricing</a>
                        <div class="absolute w-full h-1 bg-lightBlue bottom-0 
                        hidden group-hover:block transition-all duration-200"></div>
                        
                    </li>
                </ul>

                <div class="flex items-center gap-4">
                    <img src="./images/flag.svg" alt="India" class="w-7 h-5">
                    <button class="py-3 px-5 font-mulish text-white 
                        border border-lightBlue rounded text-sm font-bold">
                        Log in
                    </button>
                    <button class="flex items-center gap-3 py-3 px-4 text-sm font-medium rounded bg-white text-lightBlue300
                        font-mulish hover:text-lightBlue500 border transition-all duration-200">
                        Sign Up
                        <div class="opacity-70">
                            <img src="./images/arrow-right.svg" alt="arrow" class="w-4 h-4 mr-[-2px]">
                        </div>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Hero Section -->
        <div class="relative bg-deepBlue">
            <!-- hero part -->
            <div class="flex justify-between items-center max-w-[1080px] w-[83%] mx-auto">
                <section class="flex gap-8 flex-col items-start">
                    <h1 class="text-white font-mulish text-[40px] leading-[1.2] font-bold">
                        Power your finance, grow your business
                    </h1>
                    <div class="w-6 h-1 bg-greenLight"></div>
                    <p class="text-white opacity-70 text-lg">
                        Accept payments from customers, Automate payouts to vendors &
                        employees, Never run out of working capital.
                    </p>
                    <button class="rounded-md font-mulish font-bold bg-lightBlue 
                        transition-all text-white duration-200 px-4 py-3 hover:bg-lightBlue500">
                        Sign Up Now
                    </button>
                </section>

                <section class="w-full max-w-[680px]">
                    <img src="./images/hero-illustration.jpg" alt="">
                </section>
            </div>

            <!-- shape part -->
            <div class="absolute left-0 right-0 w-[103%]">
                <img src="./images/hero-shape.svg" alt="" 
                class="w-full object-fill scale-x-100">
            </div>

        </div>
        
        
    </div>
</body>
</html>
