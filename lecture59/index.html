<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown App</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <div class="container">

        <div class="box">
            <div class="c">
                <h1>Countdown Timer</h1>
                <div class="countdown">
                    <div class="days">
                        <span id="days">00</span>
                        <p>days</p>
                    </div>
                    <div class="hours">
                        <span id="hours">00</span>
                        <p>hours</p>
                    </div>
                    <div class="minutes">
                        <span id="minutes">00</span>
                        <p>minutes</p>
                    </div>
                    <div class="seconds">
                        <span id="seconds">00</span>
                        <p>seconds</p>
                    </div>
                </div>
            </div>
            
            <div class="p">
                <h2>Progress:</h2>
                <div class="progress">
                    <div id="progress-bar">
                        
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
